- insert:
    - id: chatbox-pet
      name: '@local/chatbox-pet'
      config:
        # Both features start on; the Settings row owns them at runtime
        # (<profile>/chatbox-pet/prefs.json wins over these defaults).
        pet: true
        boost: true
        sound: true
        # 翻译页的本机翻译模型（LM Studio / 任何 OpenAI 兼容端点）。
        translate:
          local:
            enabled: true
            baseUrl: http://127.0.0.1:6121/v1
            model: hy-mt2-7b
        # 第三个功能：视频理解（工具 video_read），配置放在 video 命名空间。
        video:
          whisperModel: mobiuslabsgmbh/faster-whisper-large-v3-turbo
          diarize: true
          ocr: subtitles
          frames: 8
          maxSeconds: 1800
          maxMegabytes: 500
          proxy: ''
        llm:
          # The rewrite follows the user's default model. The composer's Session
          # id travels with the request, which is what lets a provider that
          # routes per conversation (OpenCode) accept the call outside a turn.
          maxTokens: 1600
          timeoutMs: 60000