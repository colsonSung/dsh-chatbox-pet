- insert:
    - id: chatbox-pet
      name: 'dsh-chatbox-pet'
      config:
        # Both features start on; the Settings row owns them at runtime
        # (<profile>/chatbox-pet/prefs.json wins over these defaults).
        pet: true
        boost: true
        sound: true
        llm:
          # The rewrite follows the user's default model. The composer's Session
          # id travels with the request, which is what lets a provider that
          # routes per conversation (OpenCode) accept the call outside a turn.
          maxTokens: 3000
